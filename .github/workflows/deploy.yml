name: Deploy Laravel to Microdata

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Create production environment
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MIDTRANS_MERCHANT_ID: ${{ secrets.MIDTRANS_MERCHANT_ID }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
        run: |
          : "${APP_KEY:?Set the APP_KEY repository secret}"
          : "${DB_HOST:?Set the DB_HOST repository secret}"
          : "${DB_DATABASE:?Set the DB_DATABASE repository secret}"
          : "${DB_USERNAME:?Set the DB_USERNAME repository secret}"
          : "${DB_PASSWORD:?Set the DB_PASSWORD repository secret}"
          : "${MAIL_USERNAME:?Set the MAIL_USERNAME repository secret}"
          : "${MAIL_PASSWORD:?Set a newly rotated MAIL_PASSWORD repository secret}"
          : "${MAIL_FROM_ADDRESS:?Set the MAIL_FROM_ADDRESS repository secret}"

          if [ -z "$MIDTRANS_SERVER_KEY" ] || [ -z "$MIDTRANS_CLIENT_KEY" ]; then
            echo "::warning::Midtrans keys are missing; payment checkout will not work until both secrets are configured."
          fi

          cat > .env <<EOF
          APP_NAME="Company Profile Website Builder"
          APP_ENV=production
          APP_KEY=${APP_KEY}
          APP_DEBUG=false
          APP_URL=https://web.microdata.co.id

          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=en_US
          APP_MAIN_DOMAIN=microdata.co.id
          APP_PRIMARY_HOST=web.microdata.co.id
          APP_TRUSTED_HOSTS=web.microdata.co.id,*.microdata.co.id,localhost,127.0.0.1
          FILESYSTEM_PUBLIC_URL=https://web.microdata.co.id/uploads
          FILESYSTEM_WEBSITES_URL=https://web.microdata.co.id/uploads/websites

          APP_MAINTENANCE_DRIVER=file

          BCRYPT_ROUNDS=12

          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=error

          DB_CONNECTION=mysql
          DB_HOST=${DB_HOST}
          DB_PORT=3306
          DB_DATABASE=${DB_DATABASE}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}

          SESSION_DRIVER=database
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null

          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=database
          CACHE_STORE=database

          MAIL_MAILER=smtp
          MAIL_SCHEME=null
          MAIL_HOST=smtp.gmail.com
          MAIL_PORT=587
          MAIL_USERNAME=${MAIL_USERNAME}
          MAIL_PASSWORD=${MAIL_PASSWORD}
          MAIL_ENCRYPTION=tls
          MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
          MAIL_FROM_NAME="\${APP_NAME}"

          FRONTEND_URL=https://web.microdata.co.id
          FRONTEND_URL_ALT=https://web.microdata.co.id

          SANCTUM_STATEFUL_DOMAINS=web.microdata.co.id
          SANCTUM_TOKEN_PREFIX="cpwb"
          AUTH_TOKEN_NAME=auth-token

          MIDTRANS_MERCHANT_ID=${MIDTRANS_MERCHANT_ID}
          MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY}
          MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY}
          MIDTRANS_IS_PRODUCTION=false
          MIDTRANS_SANITIZED=true
          MIDTRANS_3DS=true

          VITE_APP_NAME="\${APP_NAME}"
          EOF

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-scripts

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare deployment structure
        run: |
          rm -rf deploy
          mkdir -p deploy

          # Copy Laravel application
          cp -a app deploy/
          cp -a bootstrap deploy/
          cp -a config deploy/
          cp -a database deploy/
          cp -a resources deploy/
          cp -a routes deploy/
          cp -a storage deploy/
          cp -a vendor deploy/

          cp artisan deploy/
          cp composer.json deploy/
          cp composer.lock deploy/

          # Copy public assets/files to ROOT (except public/index.php)
          cp -a public/. deploy/
          rm -f deploy/index.php

          # Copy production environment
          cp .env deploy/.env

          # Apache .htaccess for Laravel at ROOT document root
          cat > deploy/.htaccess <<'HTACCESS'
          DirectoryIndex index.php

          <IfModule mod_rewrite.c>
              <IfModule mod_negotiation.c>
                  Options -MultiViews -Indexes
              </IfModule>

              RewriteEngine On

              RewriteRule ^(?:app|bootstrap|config|database|resources|routes|vendor)(?:/|$) - [F,L]
              RewriteRule ^(?:\.env|\.git)(?:/|$) - [F,L]

              RewriteCond %{HTTP:Authorization} .
              RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

              RewriteCond %{HTTP:x-xsrf-token} .
              RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]

              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_URI} (.+)/$
              RewriteRule ^ %1 [L,R=301]

              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteRule ^ index.php [L]
          </IfModule>
          HTACCESS

          # Custom Laravel entry point that lives at ROOT
          cat > deploy/index.php <<'PHP'
          <?php

          use Illuminate\Foundation\Application;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          if (file_exists($maintenance = __DIR__.'/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          require __DIR__.'/vendor/autoload.php';

          /** @var Application $app */
          $app = require_once __DIR__.'/bootstrap/app.php';

          // Because public/ contents were moved to ROOT, we tell Laravel
          // that the "public" path is actually the project root.
          $app->usePublicPath(__DIR__);

          $app->handleRequest(Request::capture());
          PHP

          # Remove development/unnecessary files
          rm -rf deploy/tests
          rm -rf deploy/node_modules
          rm -rf deploy/.git
          rm -rf deploy/.github
          rm -f deploy/database/seeders/starter_templates_data.json
          rm -rf deploy/storage/logs/*
          rm -rf deploy/storage/framework/cache/data/*
          rm -rf deploy/storage/framework/views/*
          rm -rf deploy/storage/framework/sessions/*

      - name: Create deployment zip
        run: |
          cd deploy
          zip -r -q -9 ../deploy.zip .
          cd ..
          ls -lh deploy.zip

      - name: Create unzip.php
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          : "${DEPLOY_TOKEN:?Set the DEPLOY_TOKEN repository secret}"
          DEPLOY_TOKEN_PHP=$(php -r 'echo var_export(getenv("DEPLOY_TOKEN"), true);')

          cat > unzip.php <<PHP
          <?php
          \$expectedToken = ${DEPLOY_TOKEN_PHP};
          \$providedToken = \$_GET['token'] ?? null;
          if (!is_string(\$providedToken) || !hash_equals(\$expectedToken, \$providedToken)) {
              http_response_code(403);
              exit('Forbidden');
          }
          set_time_limit(0);
          ignore_user_abort(true);

          try {
              \$zip = __DIR__ . '/deploy.zip';
              if (!is_file(\$zip)) {
                  throw new RuntimeException('Deployment archive not found.');
              }

              \$archive = new ZipArchive();
              if (\$archive->open(\$zip) !== true) {
                  throw new RuntimeException('Unable to open deployment archive.');
              }
              if (!\$archive->extractTo(__DIR__)) {
                  \$archive->close();
                  throw new RuntimeException('Unable to extract deployment archive.');
              }
              \$archive->close();

              \$publicStorage = __DIR__ . '/storage/app/public';
              \$uploadsPath = __DIR__ . '/uploads';
              if (!is_dir(\$publicStorage) && !mkdir(\$publicStorage, 0775, true) && !is_dir(\$publicStorage)) {
                  throw new RuntimeException('Public storage directory is missing.');
              }
              if (is_link(\$uploadsPath)) {
                  if (realpath(\$uploadsPath) !== realpath(\$publicStorage)) {
                      throw new RuntimeException('The uploads link points to an unexpected location.');
                  }
              } elseif (file_exists(\$uploadsPath)) {
                  throw new RuntimeException('The uploads path already exists and is not a symbolic link.');
              } elseif (!symlink(\$publicStorage, \$uploadsPath)) {
                  throw new RuntimeException('Unable to create the public uploads link.');
              }

              \$configCache = __DIR__ . '/bootstrap/cache/config.php';
              if (is_file(\$configCache) && !unlink(\$configCache)) {
                  throw new RuntimeException('Unable to clear cached Laravel configuration.');
              }

              require __DIR__ . '/vendor/autoload.php';
              \$app = require __DIR__ . '/bootstrap/app.php';
              \$kernel = \$app->make(Illuminate\Contracts\Console\Kernel::class);

              \$commands = [
                  'migrate' => ['--force' => true],
                  'config:clear' => [],
                  'cache:clear' => [],
              ];

              foreach (\$commands as \$command => \$arguments) {
                  \$exitCode = \$kernel->call(\$command, \$arguments);
                  echo strtoupper(\$command) . " OUTPUT:\n" . \$kernel->output() . "\n";
                  if (\$exitCode !== 0) {
                      throw new RuntimeException("Artisan command failed: {\$command} (exit {\$exitCode}).");
                  }
              }

              if (is_file(\$zip) && !@unlink(\$zip) && is_file(\$zip)) {
                  throw new RuntimeException('Deployment succeeded but archive cleanup failed.');
              }
              if (!unlink(__FILE__)) {
                  throw new RuntimeException('Deployment succeeded but deploy script cleanup failed.');
              }

              echo "DEPLOY AND MIGRATIONS OK\n";
          } catch (Throwable \$exception) {
              error_log('Deployment failed: ' . \$exception->getMessage());
              http_response_code(500);
              echo 'DEPLOY FAILED: ' . \$exception->getMessage() . "\n";
          }
          PHP

      - name: Upload zip and unzip.php via FTP
        timeout-minutes: 45
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          : "${FTP_SERVER:?Set the FTP_SERVER repository secret}"
          : "${FTP_USERNAME:?Set the FTP_USERNAME repository secret}"
          : "${FTP_PASSWORD:?Set the FTP_PASSWORD repository secret}"

          upload_ftp_file() {
            local file="$1"
            local remote_name="$2"
            local max_retries=5
            local count=0
            local success=0

            echo "Uploading ${file} ($(du -h "$file" | cut -f1)) to /webroot/ROOT/${remote_name}"

            while [ $count -lt $max_retries ]; do
              count=$((count + 1))
              echo "FTP Upload Attempt ${count}/${max_retries} for ${remote_name}..."

              if curl \
                --fail \
                --show-error \
                --ftp-pasv \
                --disable-epsv \
                --ftp-skip-pasv-ip \
                --keepalive-time 15 \
                --connect-timeout 60 \
                --max-time 1800 \
                --retry 3 \
                --retry-delay 5 \
                --retry-all-errors \
                --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                --upload-file "$file" \
                --write-out "\nTransfer complete: %{size_upload} bytes in %{time_total}s\n" \
                "ftp://${FTP_SERVER}/webroot/ROOT/${remote_name}"; then
                  echo "Successfully uploaded ${remote_name}"
                  success=1
                  break
              else
                  echo "::warning::Upload attempt ${count} failed for ${remote_name}. Retrying in 10 seconds..."
                  sleep 10
              fi
            done

            if [ $success -ne 1 ]; then
              echo "::error::FTP upload failed after ${max_retries} attempts for ${remote_name}"
              exit 1
            fi
          }

          upload_ftp_file deploy.zip deploy.zip
          upload_ftp_file unzip.php unzip.php

      - name: Trigger extraction and migrate
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          sleep 5
          echo "Triggering extraction and migrations..."
          curl --fail-with-body --show-error --silent --max-time 900 --retry 3 --retry-delay 10 --retry-all-errors \
            --get --data-urlencode "token=${DEPLOY_TOKEN}" \
            "https://web.microdata.co.id/unzip.php"
          echo ""
          echo "Extraction and migrations completed."
