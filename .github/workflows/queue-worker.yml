name: Queue Worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger queue worker
        run: |
          curl -sS --max-time 70 \
            "https://web.microdata.co.id/internal/queue-worker?token=${{ secrets.DEPLOY_TOKEN }}"
